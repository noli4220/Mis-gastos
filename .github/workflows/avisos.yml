name: Avisos diarios

on:
  schedule:
    # Horas en UTC. Miami (hora del este, nov–mar) = UTC-5.
    - cron: "0 18 * * *"   # 1:00 pm
    - cron: "0 23 * * *"   # 6:00 pm
    - cron: "30 2 * * *"   # 9:30 pm
  workflow_dispatch:
    inputs:
      slot:
        description: "mediodia, tarde o noche"
        default: "tarde"

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: push
      - run: node send.js
        working-directory: push
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SLOT: ${{ github.event.inputs.slot }}
